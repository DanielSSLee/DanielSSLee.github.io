<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daniel Lee — PowerShell Terminal (PS C:\Users\DanielLee)</title>
  <meta name="description" content="Interactive PowerShell CLI Terminal Portfolio — Daniel Lee, B.S. Computer Engineering @ Texas A&M" />
  <link rel="stylesheet" href="terminal.css" />
  <script defer src="terminal.js"></script>
  <!-- Iframe mode: hide duplicate chrome when embedded in DanielOS desktop -->
  <script>
    if (window !== window.top) {
      document.addEventListener('DOMContentLoaded', () => {
        // Hide the inner titlebar (DanielOS already has one)
        const tb = document.querySelector('.terminal-titlebar');
        if (tb) tb.style.display = 'none';
        // Hide CRT overlays (they'd be clipped by the window frame anyway)
        document.querySelectorAll('.crt-overlay, .scanline').forEach(el => el.style.display = 'none');
        // Remove the .app-container padding so the terminal fills the frame edge-to-edge
        const app = document.querySelector('.app-container');
        if (app) { app.style.padding = '0'; app.style.minHeight = '100vh'; }
        const tw = document.querySelector('.terminal-window');
        if (tw) { tw.style.height = '100vh'; tw.style.borderRadius = '0'; tw.style.border = 'none'; }
      });
    }
  </script>
</head>

<body>
  <!-- CRT scanlines overlay -->
  <div class="crt-overlay"></div>
  <div class="scanline"></div>

  <div class="app-container">
    <div class="terminal-window" id="terminal-window">

      <!-- ── TITLEBAR ── -->
      <div class="terminal-titlebar">
        <div class="titlebar-left">
          <div class="terminal-icon" aria-hidden="true">PS</div>
          <span id="window-title">Windows PowerShell — Daniel Lee [C:\Users\DanielLee]</span>
        </div>
        <div class="titlebar-controls">
          <!-- Theme picker -->
          <div class="theme-picker-container">
            <select class="theme-select" id="theme-select" title="Switch terminal theme" aria-label="Terminal Theme">
              <option value="powershell" selected>🔵 PowerShell</option>
              <option value="matrix">🟢 Matrix</option>
              <option value="amber">🟠 Amber CRT</option>
              <option value="cyberpunk">🟣 Cyberpunk</option>
              <option value="dark">⚫ Dark</option>
            </select>
          </div>
          <!-- CRT toggle -->
          <button class="win-btn crt-toggle-btn" id="crt-toggle" title="Toggle CRT scanlines" aria-label="Toggle CRT Effect">CRT: ON</button>
          <!-- Window controls -->
          <button class="win-btn" id="btn-min" title="Minimize" aria-label="Minimize">_</button>
          <button class="win-btn" id="btn-max" title="Maximize" aria-label="Maximize">□</button>
          <button class="win-btn btn-close" id="btn-close" title="Close" aria-label="Close">✕</button>
        </div>
      </div>

      <!-- ── QUICK NAV BAR ── -->
      <div class="quick-nav-bar" role="toolbar" aria-label="Quick Commands">
        <span class="nav-label">Quick&gt;</span>
        <button class="quick-cmd-btn" data-cmd="help"                      title="help">[  help  ]</button>
        <button class="quick-cmd-btn" data-cmd="ls"                         title="ls">[  ls  ]</button>
        <button class="quick-cmd-btn" data-cmd="cd pages"                   title="cd pages">[ cd pages ]</button>
        <button class="quick-cmd-btn" data-cmd="cat bio.txt"                title="cat bio.txt">[ cat bio.txt ]</button>
        <button class="quick-cmd-btn" data-cmd="open about.html"            title="about">[ about.html ]</button>
        <button class="quick-cmd-btn" data-cmd="open projects.html"         title="projects">[ projects.html ]</button>
        <button class="quick-cmd-btn" data-cmd="open contact.html"          title="contact">[ contact.html ]</button>
        <button class="quick-cmd-btn" data-cmd="ascii avatar"               title="avatar">[ ascii avatar ]</button>
        <button class="quick-cmd-btn" data-cmd="theme matrix"               title="matrix theme">[ matrix ]</button>
        <button class="quick-cmd-btn" data-cmd="tree"                       title="tree">[ tree ]</button>
        <button class="quick-cmd-btn" data-cmd="clear"                      title="clear">[ cls ]</button>
        <button class="quick-cmd-btn" data-cmd="cd .."                      title="go back" class="mobile-hide">[ cd .. ]</button>
      </div>

      <!-- ── TERMINAL BODY ── -->
      <main class="terminal-body" id="terminal-body">

        <!-- Interactive terminal output log — JS boots into this -->
        <div class="terminal-output" id="terminal-output"></div>

        <!-- Input row -->
        <div class="terminal-input-row">
          <div class="input-wrapper">
            <span class="prompt-string" id="prompt-string">PS C:\Users\DanielLee&gt;</span>&nbsp;
            <input
              type="text"
              id="cmd-input"
              class="cmd-input"
              placeholder="Type a command... (try: help, ls, dir, cat bio.txt, tree)"
              autocomplete="off"
              spellcheck="false"
              aria-label="PowerShell Command Input"
            />
          </div>
        </div>

      </main>


      <!-- ── STATUSBAR ── -->
      <div class="terminal-statusbar" aria-label="Terminal Status Bar">
        <div class="status-item">
          <span class="status-label">PWD:</span>
          <span id="status-pwd">C:\Users\DanielLee</span>
        </div>
        <div class="status-item">
          <span class="status-label">ITEMS:</span>
          <span id="status-items">5 items</span>
        </div>
        <div class="status-item mobile-hide">
          <span class="status-label">SHELL:</span>
          <span>PowerShell v10.0.19045</span>
        </div>
        <div class="status-item mobile-hide">
          <span class="status-label">KEYS:</span>
          <span><kbd>↑↓</kbd> history &nbsp; <kbd>Tab</kbd> complete &nbsp; <kbd>Ctrl+L</kbd> clear</span>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
